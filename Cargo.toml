# n2bio/Cargo.toml

[workspace]
resolver = "2"
members = [
    "n2bio",
    "examples/fastfilter",
    "examples/fastcov",
    "examples/pfqbz2gz",
    "peat",
    "pfqsim",
    
]

[workspace.package]
